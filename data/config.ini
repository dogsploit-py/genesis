# GENESIS configuration
# Auto-generated from the constant registry (core/config.cpp).
# Every value the simulation uses is here; nothing is hardcoded in logic.

[world]
# World width in tiles. Memory is ~64 bytes/tile: 1024 = 67 MB, 4096 = 1.07 GB.
width = 1024
# World height in tiles. Same memory note as world.width.
height = 1024
# Edge length of one tile in metres. Sets the physical scale of everything.
tile_metres = 50
# Elevation in metres that counts as sea level.
sea_level = 0
# Degrees of latitude spanned top to bottom. Drives insolation and seasons.
latitude_span = 120

[worldgen]
# Number of tectonic plates seeded. Boundaries become mountain belts and faults.
plates = 12
# Target fraction of the map above sea level, matched by quantile.
continent_fraction = 0.34
# fBm octaves for base terrain. More octaves = finer detail, slower generation.
noise_octaves = 8
# Frequency multiplier between successive fBm octaves.
noise_lacunarity = 2
# Amplitude multiplier between successive fBm octaves (persistence).
noise_gain = 0.5
# Base spatial frequency of terrain noise, in cycles per tile.
noise_scale = 0.0025
# Baseline elevation of oceanic crust in metres. Dense basaltic crust floats low on the mantle, which is why ocean basins are deep.
oceanic_baseline = -3800
# Baseline elevation of continental crust in metres. Less dense than oceanic crust, so it floats higher.
continental_baseline = 700
# Probability that a given tectonic plate is oceanic rather than continental.
oceanic_plate_fraction = 0.55
# Peak orogenic uplift in metres at a convergent plate boundary.
uplift_strength = 1800
# Distance in tiles over which plate-boundary uplift decays.
mountain_falloff = 28
# Hydraulic + thermal erosion iterations during generation. Carves valleys.
erosion_passes = 60
# Fraction of the computed slope-driven material moved per erosion pass.
erosion_rate = 0.22
# Upstream flow accumulation (in tiles) above which a channel counts as a river.
river_threshold = 220
# Global multiplier on ore deposit abundance from all emplacement processes.
ore_richness = 1
# Number of stacked rock strata stored per tile, surface-first.
strata_layers = 6

[climate]
# Global AREA-MEAN surface temperature at sea level, degrees C. The latitude profile is constructed so its area average is exactly this value.
base_temperature = 14
# Equator-to-pole temperature contrast in degrees C. Earth's is about 40: roughly +27 C at the equator against -13 C at the pole.
pole_gradient = 40
# Atmospheric temperature drop in degrees C per 1000 m of elevation.
lapse_rate = 6.5
# Peak summer-to-winter temperature swing at high latitude, degrees C.
seasonal_amplitude = 12
# Peak day-to-night temperature swing, degrees C.
diurnal_amplitude = 6
# Planetary axial tilt in degrees. Zero removes seasons entirely.
axial_tilt = 23.44
# Baseline annual precipitation in mm before orographic and latitude effects.
base_rainfall = 900
# How strongly windward slopes gain rain and lee slopes lose it (rain shadow).
orographic_strength = 1.4
# Direction the prevailing wind blows FROM, degrees clockwise from north.
prevailing_wind_deg = 270
# How much large water bodies damp the local temperature range.
ocean_moderation = 0.55

[env]
# Ticks between tile thermal relaxation steps. Matches the soil/rock time constant.
thermal_period_ticks = 6
# Ticks between evaporation / soil moisture / water table updates (default: daily).
hydrology_period_ticks = 24
# Ticks between plant growth and seed dispersal updates (default: daily).
ecology_period_ticks = 24
# Ticks between rainfall pattern and flow accumulation refresh (default: monthly).
weather_period_ticks = 720
# Ticks between erosion, sedimentation and glaciation steps (default: yearly).
geology_period_ticks = 8640
# Run long-timescale erosion and sediment transport during the simulation.
enable_erosion = true
# Allow ice sheets to form and retreat at high latitude and elevation.
enable_glaciation = true

[ecology]
# Logistic growth rate of plant biomass per daily step, at optimal conditions.
plant_growth_rate = 0.25
# Carrying capacity of plant biomass per tile, in kg.
plant_max_biomass = 800
# Temperature in degrees C at which photosynthesis peaks.
optimal_temperature = 22
# Width of the photosynthesis temperature response curve, degrees C.
temperature_tolerance = 16
# Soil N/P/K drawn down per unit of biomass grown.
nutrient_uptake = 0.3
# Fraction of dead biomass returned to soil nutrients per daily step.
decay_return_rate = 0.003
# Fraction of a corpse's mass returned to soil nutrients, closing the cycle.
corpse_nutrient_return = 0.6

[sim]
# Wall-clock budget per sim tick batch. Larger = less locking, coarser UI latency.
batch_target_ms = 2
# Background worker threads. 0 = auto (hardware_concurrency - 1). Baked into saves.
worker_threads = 0
# Autosave every N simulated years. 0 disables autosave.
autosave_years = 25
# Maximum world events retained in the ring buffer shown by the Event Feed.
event_log_capacity = 20000
# Ticks between time-series chart samples (default: monthly).
telemetry_period_ticks = 720
# Maximum samples retained per time series before the oldest are dropped.
telemetry_capacity = 60000
# Maximum simultaneous agents. Slots are allocated up front and never grow, so this sets the memory ceiling: roughly 22 KB per slot for genome, brain and body.
max_agents = 12000
# Founding population placed at world creation.
founder_count = 20
# Age the founders are created at. They arrive as established adults so a run does not open with a decade of waiting before anyone can breed.
founder_age_years = 14
# Radius in tiles the founders are scattered over. A tight cluster means a severe founder effect and a lot of early inbreeding.
founder_spread = 10
# Ancestry records retained. The oldest are dropped past this, which only degrades relatedness estimates for very deep lineages.
pedigree_capacity = 400000

[agents]
# Spatial hash cell size in tiles. Should be about the largest sensory range.
spatial_cell_tiles = 8
# How many other individuals an agent can remember. Finite social memory is a real constraint on group size.
relationship_capacity = 24
# Pedigree recursion depth for relatedness. Deeper is more accurate and costs exponentially more.
kin_depth = 5
# Baseline energy burned per hour before activity, at unit size. Scaled by mass^0.75, following Kleiber's law.
base_metabolic_burn = 0.25
# Energy cost per tile moved, per unit size.
move_energy_cost = 0.5
# Energy per degree C per hour spent outside the comfortable thermal band.
thermoregulation_cost = 0.2
# Water lost per hour at unit size. Roughly 5% of body water per day, which is the mammalian figure; much above that and agents cannot travel far enough between water sources to forage at all.
hydration_burn = 0.18
# Maximum plant biomass consumed per hour. Biomass genuinely leaves the tile.
eat_rate_kg = 1.2
# Energy yield per kg of biomass, before digestive efficiency.
energy_per_kg = 9
# Hydration restored per hour while drinking.
drink_rate = 12
# Maximum heading change in radians per hour at full turn output.
turn_rate = 0.9
# Floor on how weak starvation and injury can make an agent. Zero reproduces the death spiral this floor exists to prevent: with no energy an agent cannot move, so it can never reach the food that would save it.
min_vigour = 0.3
# Velocity damping per hour. High drag means movement stops as soon as thrust does.
drag = 0.35
# Gompertz hazard scale: baseline probability of death per hour at age zero.
base_mortality = 4e-07
# How steeply the mortality hazard rises with age. The hazard multiplies by exp(this) over a full lifespan, so lifespan is a distribution, not a cap.
gompertz_exponent = 5.5
# Reproductive drive accumulated per hour in a healthy, well-fed adult. Discharging it on a successful mating emits the large reward pulse.
repro_drive_rate = 0.004
# How far apart two agents can be and still court.
courtship_range = 6
# Reproductive drive needed before an agent will court at all.
courtship_drive_threshold = 0.25
# Hours before an agent will attempt courtship again, whatever the outcome. Without a refractory period a pair re-evaluates every tick, is refused within hours, and the rejection memory then locks them out for good.
courtship_cooldown = 72
# Energy each partner spends on a mating.
mating_energy_cost = 12
# Size of the reward pulse emitted on a successful mating. Because eligibility traces are still warm, this reinforces the whole preceding behaviour chain.
mating_reward_pulse = 3
# Sustained reward per hour for being near a bonded partner. The oxytocin analogue: this is how monogamy and mate-guarding can evolve.
bond_proximity_reward = 0.02
# Base probability a mating forms a lasting pair bond, scaled by how much both partners value affiliation.
bond_formation_chance = 0.25
# Probability a mating conceives, before fertility traits are applied.
base_conception_chance = 0.6
# Extra energy the gestating parent burns per hour.
gestation_energy_cost = 0.5
# Base probability the gestating parent dies giving birth, modified by hardiness and condition.
childbirth_mortality = 0.012
# How many other individuals one agent can take in at once. Bounded attention, which is the realistic case: an animal in a herd of five hundred does not individually track five hundred others, and this model already says social MEMORY is finite. Which neighbours are perceived follows the spatial index's traversal order, so it is fixed and reproducible but not sorted by distance.
max_perceived_neighbours = 24
# How many neighbours one individual can groom or share with in a single simulated hour. A bound is the realistic case, not the unbounded one: agents converge on water and forage, so a tile can hold dozens of them, and without this an individual groomed every neighbour within reach every hour. It also decides how the serial interaction stage scales -- unbounded, its cost followed local crowding rather than population size.
max_interactions_per_tick = 8
# Fraction of its own energy an agent hands to each neighbour when the share output fires. Giving stops once the giver drops below half reserves, so generosity is costly without being suicidal.
share_fraction = 0.02
# Health removed per hour of sustained attack at unit strength, before the target's hardiness resists it.
attack_damage = 0.02
# Energy the attacker spends per hour of fighting. Aggression has to cost something or it is never worth not doing.
attack_energy_cost = 2
# How far a parent will provision a juvenile.
parental_care_range = 4

[genetics]
# Number of chromosomes. Independent assortment happens per chromosome, so this sets how much of the genome travels together.
chromosomes = 8
# Maximum genes per genome. Duplication cannot grow a genome past this ceiling.
gene_capacity = 320
# Coding loci per trait. Every visible trait is polygenic by construction.
genes_per_trait = 4
# Genes that modulate the expression of a trait rather than contributing to it. This is real epistasis: an allele's effect depends on a different locus.
regulatory_genes = 14
# Neutral loci with no phenotypic effect. They drift under mutation alone, which is what makes them the right clock for phylogeny and Fst.
junk_genes = 26
# Immune recognition loci. Overdominant, so heterozygotes resist more pathogens.
mhc_genes = 6
# Fraction of coding loci that can carry a recessive lethal or sublethal allele. This is what gives inbreeding a real, countable cost.
lethal_capable_fraction = 0.06
# Genetic map length of each chromosome in centiMorgans.
chromosome_length_cm = 100
# Mean crossovers per chromosome per meiosis. Lower means stronger linkage.
crossover_rate = 1.4
# Recombination hotspots per chromosome. Crossovers cluster at these.
hotspots_per_chromosome = 3
# Standard deviation of founder allele values. Larger means more standing genetic variation to start from.
founder_allele_sigma = 0.6
# Founder allele spread at MHC loci, which start deliberately diverse.
founder_mhc_sigma = 1.8
# Environmental and developmental noise added at expression. This is why the same genotype does not produce the same phenotype twice.
developmental_noise = 0.35
# Alleles are continuous, so population-genetic statistics discretise them into bins this wide -- the natural resolution of one point mutation.
allele_bin_width = 0.25
# How far the sex locus shifts sex expression. Less than 0.5 leaves room for intermediate outcomes.
sex_locus_shift = 0.34
# Energy per hour per unit of ornament. The brake on Fisherian runaway: without a real cost, display could grow without limit.
ornament_metabolic_cost = 0.22

[mutation]
# Per gene per meiosis chance of a Gaussian nudge to one allele.
point_rate = 0.004
# Size of a point mutation.
point_sigma = 0.18
# Per genome chance a brand-new random gene appears.
insertion_rate = 0.0006
# Per gene chance of loss. The sex locus is never deleted.
deletion_rate = 0.0008
# Per gene chance of duplication. THIS is what lets genome complexity grow: the copy is a new locus that can diverge and pick up a new function.
duplication_rate = 0.0012
# Per genome chance a segment reverses, which suppresses crossover through it and locks the alleles inside into a co-inherited block.
inversion_rate = 0.0004
# Per gene chance of moving to a different chromosome.
translocation_rate = 0.0003
# Per meiosis chance of whole-chromosome duplication: the origin of polyploidy.
chromosome_dup_rate = 2e-05
# Per capable gene per meiosis chance an allele breaks outright.
lethal_rate = 0.00025
# Per regulatory gene chance of retargeting to a different trait.
regulatory_shift_rate = 0.002

[brain]
# Maximum neurons per brain. 48 inputs and 20 outputs are fixed, so the rest is the hidden-layer ceiling.
node_capacity = 128
# Maximum synapses per brain.
connection_capacity = 224
# Fraction of possible input-to-output connections a founder starts with. Sparse on purpose: useful structure should have to be found.
founder_connection_density = 0.12
# Fraction of connections subject to lifetime learning. The rest are fixed by the genome and change only across generations.
plastic_fraction = 0.45
# Per connection per birth chance of a weight nudge.
weight_mutation_rate = 0.06
# Size of a weight mutation.
weight_mutation_sigma = 0.22
# Per birth chance of growing a new synapse. Cycles are allowed: they become the recurrent edges that give the network memory.
add_connection_rate = 0.05
# Per birth chance of splitting a connection with a new neuron. The first new edge is weighted 1.0 so behaviour is initially almost unchanged.
add_node_rate = 0.018
# Per connection per birth chance of being enabled or disabled.
toggle_connection_rate = 0.012
# Per neuron per birth chance its activation function changes.
activation_mutation_rate = 0.01
# Chance a connection present in only one parent is inherited. Below 1.0 so topology can simplify as well as grow.
disjoint_inherit_chance = 0.65
# Eligibility trace decay per hour. This sets how far back in a behaviour chain a reward can still assign credit.
trace_decay = 0.92
# How fast the reward baseline tracks actual reward. A fully predicted reward produces no prediction error and therefore teaches nothing.
value_baseline_rate = 0.02
# Passive decay of learned weights, so unreinforced learning fades.
weight_decay = 2e-05
# Negative resting bias on the attack output. Without it, random weights make unprovoked aggression fire about half the time and it kills roughly a third of every founding population. Stored as an ordinary heritable allele, so selection can undo it.
aggression_bias = 2
# Negative resting bias on the share output, for the same reason.
sharing_bias = 1.2
# Give founder brains a small set of innate reflexes: drink when thirsty, eat when hungry, turn toward what you see, flee when hurt, display when ready. Newborn mammals root and suckle without learning. Turn this OFF to watch the honest baseline: a purely random network dehydrates in about ten days and the founding population goes extinct before learning or selection can start.
innate_reflexes = true
# Weight given to innate reflex connections. They live in the GENOME, so evolution can strengthen, weaken or discard every one of them.
innate_reflex_strength = 2.5

[sex]
# Sex determination: 0 = XY (male heterogametic), 1 = ZW (female heterogametic), 2 = temperature-dependent.
system = 0
# Pivot temperature for temperature-dependent sex determination.
pivot_temperature = 29
# Lower bound of the sex-expression band counted as ambiguous.
intersex_low = 0.42
# Upper bound of the ambiguous band.
intersex_high = 0.58
# Fertility multiplier when either partner's expression is ambiguous. Reduced, not abolished.
intersex_fertility = 0.35

[attraction]
# Attraction score an agent of zero selectivity requires before accepting.
base_threshold = 0.35
# How much the PartnerSelectivity trait raises that threshold.
selectivity_scale = 1.1
# How much accumulated reproductive drive lowers the threshold. A long-unmated individual genuinely relaxes its standards.
drive_relief = 0.75
# Weight on repeated harmless encounters.
familiarity_weight = 0.45
# Weight on the target's general standing in the group.
reputation_weight = 0.35
# Weight on the remembered valence of past interactions with this individual.
history_weight = 0.8
# Attraction bonus toward an existing bonded partner.
bond_bonus = 1.2
# Attraction penalty after being refused. Rejection is remembered.
rejection_memory = 0.18
# Weight on similarity to the template imprinted in early life.
imprint_weight = 0.55
# Probability a newborn imprints on a parent at all.
imprint_chance = 0.7
# Attraction penalty per unit of relatedness. Inbreeding avoidance can evolve because inbreeding depression here is real, not decorative.
kin_avoidance = 2.2

[stats]
# Individuals sampled for population-genetic statistics. This is a REPORTING cost only: every agent is still simulated in full.
genetics_sample = 600
# Grid divisions per axis used to define geographic subpopulations for Fst.
fst_grid = 3
# Ticks between population-genetics recomputations (default: monthly).
period_ticks = 720

[god]
# Maximum divine acts kept on the undo stack. Each record stores the tiles and whole agents the act touched, so a mass kill of a thousand individuals is a large record.
undo_depth = 64
# Memory budget for undo history. Oldest records are dropped past this rather than letting the history quietly consume the machine.
undo_memory_mb = 512
# Starting radius of terrain and resource brushes, in tiles.
default_brush_radius = 8
# Starting brush intensity. Brushes fall off smoothly to zero at the rim.
default_brush_intensity = 1

[rules]
# Global multiplier on baseline metabolic burn. Below 1 makes food go further; 0 makes agents cost nothing to keep alive.
metabolism_multiplier = 1
# Global multiplier on every mutation rate, applied on top of each individual's own heritable mutator alleles.
mutation_rate_multiplier = 1
# Scales every individual's intrinsic lifespan, and therefore the Gompertz mortality curve.
lifespan_multiplier = 1
# Speeds up or slows down gestation. Above 1 shortens pregnancies.
gestation_multiplier = 1
# Scales the reward signal driving lifetime learning. 0 freezes learning for the whole population without freezing the brains themselves.
learning_rate_multiplier = 1
# Scales every reaction RATE. Applied to the Arrhenius rate only and never to dG, so speeding a reaction up cannot make an uphill one spontaneous -- that would be rewriting thermodynamics rather than adjusting kinetics.
reaction_rate_multiplier = 1
# Surface gravity in m/s2. Affects projectile and structural physics; body mechanics are not yet gravity-dependent.
gravity = 9.81
# Freeze biological age at zero. Damage still accumulates and is still shown, so you can watch what would have killed them.
disable_aging = false
# Suppress the attack action entirely. Aggression still evolves in the genome; it simply cannot be expressed.
disable_violence = false
# Nothing dies. An agent that would have died is held at the brink instead.
disable_death = false

[lua]
# Maximum VM instructions one console chunk may execute. A script runs with the world lock held, so an unbounded loop would hang the simulation; this stops it instead.
instruction_budget = 20000000

[econ]
# Share output above which an individual is willing to exchange goods. The prosocial output is reused rather than a new one added, because the brain's output count is part of the genome format: adding one would invalidate every saved brain.
trade_threshold = 0.55
# How close two individuals must be to trade, in tiles.
trade_range = 2
# How much joint surplus an exchange must produce before it happens. Both sides must gain, or it is a donation rather than a trade.
min_gain = 0.15
# What fraction of a holding changes hands in one exchange.
trade_fraction = 0.5
# How often the money detector runs. 0 disables detection, which means a currency can then only ever be decreed.
detect_period_ticks = 2160
# How strongly a good must behave as a medium of exchange before it is called money. Combines turnover, the rate at which takers pass it on rather than consume it, and how reliably it is accepted.
moneyness_threshold = 0.55
# How many consecutive detection passes a good must hold that property. One pass is a fluctuation; several is a fact about the economy.
moneyness_passes = 3
# Minimum trades in a single good before it can be considered money at all, so a good traded twice by chance cannot win on ratios alone.
money_min_trades = 200
# How many different goods must be circulating before money can be declared. On a thin economy whatever is moving looks both dominant and universally accepted, so the first good to cross the line locks in on an artefact -- and since detection stops once a currency exists, that mistake is permanent.
money_min_goods = 6
# Total trades across all goods before money can be declared, for the same reason: three factors measured on a handful of exchanges are noise.
money_min_total_trades = 2000

[species]
# How often the species detector runs, in ticks. This is a MEASUREMENT of the population rather than a process acting on it, so running it more often than divergence can change would be pure cost. 0 disables detection entirely.
period_ticks = 2160
# How wide a gap counts as a species boundary, as a multiple of the population's OWN median nearest-neighbour distance. Relative to that spacing rather than absolute, because a species boundary is a discontinuity and not a distance: members of one population always have a close relative, and members of a reproductively isolated one do not. Lower splits hairs; higher lumps distinct populations together.
gap_factor = 4
# How many mutually similar individuals it takes to name a new lineage. A cluster of two is a pair of odd siblings, not a species.
min_founders = 8
# Cap on how many individuals the clustering pass compares. Clustering is quadratic, so it is bounded -- and like the population-genetics window this is a REPORTING sample, never a simulation shortcut: every agent is still simulated in full and every agent is still assigned to a lineage.
cluster_sample = 400
# How long a lineage may have no developed members before it is declared extinct. Without a grace period a population whose adults all happened to be pregnant would be buried and then resurrected under a new name.
extinction_grace_ticks = 8640
# Strength of reproductive isolation between diverged lineages. 0 makes a species a pure label with no consequence; 1 makes a fully diverged cross sterile. Applied from the pair's neutral distance, never from their labels, so it stays continuous.
hybrid_penalty = 1
# Neutral distance, in units of the population's own spacing, below which a cross pays no penalty at all. Keeps ordinary within-population pairs completely unaffected.
hybrid_onset = 4
# Distance, in the same units, at which the penalty reaches full strength. Between the onset and here it grows as the square of the excess, because hybrid breakdown compounds: the further apart the parents, the more independent incompatibilities a zygote has to survive at once.
hybrid_full = 12

[chem]
# How many distinct substances an agent can carry. Small on purpose: an individual holding forty reagents is not a forager.
inventory_slots = 8
# Moles of substance taken from a tile in one gathering action.
gather_amount = 0.5
# Pick-up output above which an agent takes what is underfoot.
gather_threshold = 0.5
# Use output above which an agent brings its held substances together and finds out what happens.
experiment_threshold = 0.55
# Accumulated curiosity drive an agent needs before it will run an experiment. Curiosity accrues slowly and an experiment discharges it, so this sets how often experimenting is even possible. Lowering it toward zero makes discovery cheap and fast, and much less interesting.
experiment_curiosity = 0.25
# Energy an experiment costs. Exploration has to be paid for, or it is not a trade-off against foraging.
experiment_energy_cost = 4
# Scale of one experiment, as a multiple of the stoichiometric coefficients.
experiment_amount = 1
# Reward pulse for an outcome the agent has never seen. Paid for NOVELTY, not for usefulness -- which is what makes exploring worth doing before you know what it will turn up.
novelty_reward = 2
# Teach output above which an agent passes knowledge to a neighbour.
teach_threshold = 0.55
# How far teaching carries, in tiles.
teach_range = 2

[knowledge]
# How many knowledge units one agent can hold. When full, the least valued is displaced -- which is why useless knowledge is lost first.
capacity = 64
# Mean fidelity lost each time knowledge is passed on. Below 0.35 fidelity a unit stops working, so a long enough chain of retelling destroys it.
teach_fidelity_loss = 0.12
# Random spread on that loss. Some tellings are much worse than others.
teach_fidelity_noise = 0.1
# Chance that a technique the teacher has and the student lacks crosses over as well. Techniques spread faster than the knowledge that uses them.
technique_transmission = 0.35
# Per-tick chance of independently working out the next technique up the ladder. Deliberately tiny: fire should be a rare event, not a schedule.
technique_discovery_rate = 2e-05
# Per-use decay on how much a holder values a piece of knowledge.
valuation_decay = 0.999

[render]
# Synchronise presentation to the display refresh. Off uncaps render FPS.
vsync = true
# Multiplier applied to zoom per mouse wheel notch.
zoom_speed = 1.14
# Furthest zoom out, in screen pixels per world tile.
min_pixels_per_tile = 0.05
# Closest zoom in, in screen pixels per world tile.
max_pixels_per_tile = 64
# Draw tile gridlines when zoomed in far enough for them to be legible.
show_grid = false
# Global scale factor for all interface fonts and widgets.
ui_scale = 1

